[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.1.3", "pandas==2.2.3", "pyarrow==19.0.1", "scikit-learn==1.6.1", "tensorflow==2.19.0", "joblib==1.4.2", "google-cloud-storage==3.14.1"]

[project.scripts]
air-quality = "air_quality_tracker.cli:main"
air-quality-cloud = "air_quality_tracker.cloud:main"

[tool.setuptools.packages.find]
where = ["src"]
