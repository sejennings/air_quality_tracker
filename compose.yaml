services:
  pipeline:
    image: ${AIR_QUALITY_IMAGE:-air-quality-tracker:local}
    build:
      context: .
    volumes:
      - ${AIR_QUALITY_DATA:-./data}:/data:ro
      - ${AIR_QUALITY_MODELS:-./runtime/models}:/models
      - ${AIR_QUALITY_OPERATIONAL:-./runtime/operational}:/operational
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: none
